          <form class="form" id="contactForm" novalidate data-animate="reveal">
            <div class="form__row form__row--2">
              <div class="field">
                <label for="name">Nom</label>
                <input id="name" name="name" type="text" placeholder="Nico" minlength="2" required />
                <small class="error" data-error-for="name"></small>
              </div>

              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Votre adresse mail" required />
                <small class="error" data-error-for="email"></small>
              </div>
            </div>

            <div class="form__row">
              <div class="field">
                <label for="subject">Sujet</label>
                <input id="subject" name="subject" type="text" placeholder="Site vitrine / formulaire / refonte..." minlength="3" required />
                <small class="error" data-error-for="subject"></small>
              </div>
            </div>

            <div class="form__row">
              <div class="field">
                <div class="field__label-row">
                  <label for="message">Message</label>
                  <span class="muted small" id="charCount">0 / 500</span>
                </div>
                <textarea id="message" name="message" rows="7" maxlength="500"
                  placeholder="Dis ce que tu veux : pages, style, contenu, deadline, etc." minlength="10" required></textarea>
                <small class="error" data-error-for="message"></small>
              </div>
            </div>

            
            <div class="form__actions">
              <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top: 12px;">
                <a class="btn btn--primary" id="sendViaGmail" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true">
                  Ouvrir Gmail (web)
                </a>
                <a class="btn btn--secondary" id="sendViaMailto" href="#" aria-disabled="true">
                  Ouvrir mon appli mail
                </a>
              </div>

              
            </div>
          </form>
        </div>
